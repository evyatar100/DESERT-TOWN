name: Map status page

on:
  push:
    branches: [main]
    paths:
      - "maps/index.html"
      - "maps/status.js"
      - "maps/status.json"
      - "maps/AGENTS.md"
      - ".github/workflows/map-status-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site/maps
          cp maps/index.html maps/status.js maps/status.json maps/AGENTS.md _site/maps/
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en"><head>' \
            '<meta charset="utf-8" />' \
            '<meta http-equiv="refresh" content="0; url=maps/" />' \
            '<title>Desert Town — Map Status</title>' \
            '</head><body>' \
            '<p><a href="maps/">Map status</a></p>' \
            '</body></html>' > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
