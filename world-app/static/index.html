<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desert Town — world-app</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>world-app</h1>
        <p class="sub">Outside maps · blue edge · orange gap</p>
      </header>
      <div class="toolbar">
        <button type="button" id="btn-save">Save</button>
        <button type="button" id="btn-reload" class="ghost">Reload</button>
        <span id="status" aria-live="polite"></span>
      </div>
      <div class="toolbar zoom-bar">
        <button type="button" id="btn-zoom-out" class="ghost" title="Zoom out (−)">−</button>
        <button type="button" id="btn-zoom-reset" class="ghost" title="Reset zoom">
          <span id="zoom-label">100%</span>
        </button>
        <button type="button" id="btn-zoom-in" class="ghost" title="Zoom in (+)">+</button>
        <span class="hint">Ctrl+wheel zoom · arrows nudge 1 tile</span>
      </div>
      <label class="search">
        <span class="sr-only">Filter maps</span>
        <input type="search" id="filter" placeholder="Filter maps…" />
      </label>
      <label class="toggle" for="toggle-in-game">
        <input type="checkbox" id="toggle-in-game" />
        <span class="swatch" aria-hidden="true"></span>
        <span>Loaded in game</span>
      </label>
      <label class="toggle" for="toggle-connections">
        <input type="checkbox" id="toggle-connections" checked />
        <span class="swatch" aria-hidden="true"></span>
        <span>Connections</span>
      </label>
      <ul id="map-list"></ul>
      <section id="conn-panel">
        <h2>Connections</h2>
        <ul id="conn-list"></ul>
      </section>
    </aside>
    <main id="stage-wrap">
      <canvas id="stage" tabindex="0"></canvas>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
